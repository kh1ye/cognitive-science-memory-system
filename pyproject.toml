[project]
name = "cognitive-science-memory-system"
version = "0.1.0"
description = "Cognitive Memory System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.143.3",
    "langchain-anthropic>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "python-dotenv>=1,<2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognitive_memory", "src/conversation_agent"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
]
