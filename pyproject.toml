[project]
name = "cognitive-science-memory-system"
version = "0.1.0"
description = "Cognitive Memory System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognitive_memory"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
]
